apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: temp-converter
        image: DOCKER_HUB_USERNAME/temp-converter:IMAGE_TAG
---
apiVersion: v1
kind: Service
metadata:
  name: temp-converter-service
spec:
  type: ClusterIP
  selector:
    app: temp-converter
  ports:
  - port: 80
    targetPort: 8000
